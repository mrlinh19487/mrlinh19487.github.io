<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#edf0f4">
<title>Cây dữ liệu công ty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#edf0f4;--dot:#d3d9e1;--sf:#fff;--tx:#17202b;--mu:#64707f;--bd:#d6dce4;--ac:#0f766e;--acx:#fff;--ln:#a7b1bf;color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12171d;--dot:#232b35;--sf:#1b222b;--tx:#e6ebf1;--mu:#93a0b0;--bd:#2c3642;--ac:#2dd4bf;--acx:#06201d;--ln:#46515f}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12171d;--dot:#232b35;--sf:#1b222b;--tx:#e6ebf1;--mu:#93a0b0;--bd:#2c3642;--ac:#2dd4bf;--acx:#06201d;--ln:#46515f}}
*,*::before,*::after{box-sizing:inherit}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.45 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}button,input,textarea{font:inherit;color:inherit}header{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:9px 12px;background:var(--sf);border-bottom:1px solid var(--bd);z-index:2}header h1{font-size:15px;font-weight:700;margin:0 8px 0 0}.b{border:1px solid var(--bd);background:var(--sf);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}.b:hover{border-color:var(--ac)}.b:focus-visible,.node:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}.b.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}.b.d{color:#c0392b}.sp{flex:1}main{flex:1;display:flex;min-height:0}#cv{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none;background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px}#cv.drag{cursor:grabbing}#ly{position:absolute;left:0;top:0;transform-origin:0 0}#sv{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}.node{position:absolute;background:var(--sf);border:1px solid var(--bd);border-left:5px solid var(--c);border-radius:10px;padding:9px 11px;cursor:pointer;user-select:none;box-shadow:0 2px 6px #0000000a}.node.sel{box-shadow:0 0 0 2px var(--c),0 4px 12px #00000012}.hd{display:flex;align-items:center;gap:7px}.ic{font-size:19px}.tt{flex:1;font-weight:600;overflow-wrap:anywhere}.lk{border:0;background:none;cursor:pointer;padding:2px;font-size:14px}.node img{width:100%;max-height:120px;object-fit:cover;border-radius:6px;margin-top:6px;display:block}.nt{margin:6px 0 0;color:var(--mu);font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere}.it{display:block;margin-top:5px;font-size:12.5px;padding:3px 7px;border-radius:6px;background:var(--bg);overflow-wrap:anywhere}.it.u{color:var(--ac);cursor:pointer}.it.u:hover{text-decoration:underline}.cb{position:absolute;right:-13px;top:50%;transform:translateY(-50%);min-width:23px;height:23px;border-radius:12px;border:1px solid var(--c);background:var(--sf);color:var(--tx);font-size:12px;cursor:pointer}#pn{width:310px;background:var(--sf);border-left:1px solid var(--bd);overflow:auto;padding:14px;flex:none}#pn label{display:block;font-size:12px;color:var(--mu);margin:11px 0 4px}#pn input[type=text],#pn textarea{width:100%;border:1px solid var(--bd);border-radius:7px;padding:7px 8px;background:var(--bg)}#pn textarea{min-height:66px;resize:vertical}.row{display:flex;gap:6px;margin-bottom:6px;align-items:center}.row input{min-width:0}.row input[type=text]{flex:1}.sw{display:flex;gap:7px;flex-wrap:wrap}.sw i{width:23px;height:23px;border-radius:50%;cursor:pointer;border:2px solid transparent}.sw i.on{border-color:var(--tx)}.ics{display:flex;flex-wrap:wrap;gap:3px}.ics span{font-size:18px;cursor:pointer;padding:2px 4px;border-radius:6px}.ics span:hover{background:var(--bg)}.hint{color:var(--mu);font-size:12px;margin:6px 0 0}dialog{width:min(560px,92vw);border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--tx);box-shadow:0 15px 50px #0003}dialog::backdrop{background:#0007}dialog textarea{width:100%;height:240px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px;font:12px monospace;color:var(--tx)}.empty{color:var(--mu);font-size:13px}.toolbar-note{font-size:11px;color:var(--mu);padding:4px 12px;background:var(--sf);border-bottom:1px solid var(--bd)}
@media(max-width:760px){header{gap:5px;padding:7px}header h1{width:100%;margin-bottom:2px}.b{padding:5px 8px;font-size:12px}main{flex-direction:column}#pn{width:auto;height:42%;border-left:0;border-top:1px solid var(--bd)}.toolbar-note{display:none}}
</style>
</head>
<body>
<header>
<h1>🌳 Cây dữ liệu công ty</h1>
<button class="b p" id="addc">＋ Nhánh con</button><button class="b" id="adds">＋ Cùng cấp</button><button class="b d" id="del">Xóa</button>
<button class="b" id="exa">Mở tất cả</button><button class="b" id="coa">Thu tất cả</button><button class="b" id="zo" aria-label="Thu nhỏ">−</button><button class="b" id="zi" aria-label="Phóng to">＋</button><button class="b" id="fit">Vừa khung</button>
<span class="sp"></span><button class="b" id="theme">Giao diện: Tự động</button><button class="b" id="mode">Chế độ: Chỉnh sửa</button><button class="b" id="io">Sao lưu / Nhập</button>
</header>
<div class="toolbar-note">Kéo nền để di chuyển sơ đồ · Cuộn chuột để thu phóng · Chọn một nhánh để chỉnh sửa</div>
<main><div id="cv" aria-label="Sơ đồ cây dữ liệu"><div id="ly"><svg id="sv"></svg><div id="nd"></div></div></div><aside id="pn" aria-label="Chỉnh sửa nhánh"></aside></main>
<dialog id="dg"><p style="margin-top:0"><b>Sao lưu / Nhập dữ liệu</b><br><span class="hint">Sao chép đoạn mã để lưu lại. Để khôi phục, dán mã vào rồi bấm “Nhập”.</span></p><textarea id="jt" aria-label="Dữ liệu JSON"></textarea><div style="display:flex;gap:6px;margin-top:8px"><button class="b p" id="jc">Sao chép</button><button class="b" id="ji">Nhập</button><span class="sp"></span><button class="b" id="jx">Đóng</button></div></dialog>
<script>
'use strict';
const KEY='cay_du_lieu_cong_ty_v1',W=230,HG=76,GAP=16;
const COLORS=['#0f766e','#2563eb','#7c3aed','#d97706','#e11d48','#475569'];
const ICONS=['📁','📄','🏢','👥','🏭','💰','📦','🛠️','📊','🔒','📞','✅','⚙️','📅','🖼️','🌐','📌','🧾'];
const uid=()=>Math.random().toString(36).slice(2,10);
const mkN=(title,extra={})=>Object.assign({id:uid(),title,icon:'📁',color:COLORS[0],note:'',url:'',img:'',items:[],children:[],collapsed:false},extra);
function sample(){const r=mkN('Dữ liệu công ty',{icon:'🏢',note:'Bấm vào nhánh để chỉnh sửa ở bảng bên phải.'});const a=(title,icon,color,items,kids)=>mkN(title,{icon,color,items:items||[],children:(kids||[]).map(title=>mkN(title,{icon:'📄',color}))});r.children=[a('Hành chính nhân sự','👥',COLORS[0],[{text:'Danh sách nhân sự',url:''},{text:'Nội quy lao động',url:''}],['Hợp đồng lao động','Chấm công','Tuyển dụng']),a('Sản xuất','🏭',COLORS[1],[{text:'Kế hoạch sản xuất',url:''}],['Quy trình','Bảo trì máy','Kiểm soát chất lượng']),a('Kinh doanh','📦',COLORS[3],[],['Khách hàng','Báo giá','Hợp đồng']),a('Tài chính kế toán','💰',COLORS[2],[],['Báo cáo','Công nợ'])];return r}
let root,sel,edit=true,view={x:40,y:40,k:1},themeMode='auto';
try{const cached=localStorage.getItem(KEY);if(cached)root=JSON.parse(cached)}catch(e){}
if(!root||!root.id||!Array.isArray(root.children))root=sample();
const $=id=>document.getElementById(id),cv=$('cv'),ly=$('ly'),sv=$('sv'),nd=$('nd'),pn=$('pn');sel=root.id;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(root))}catch(e){alert('Không thể lưu dữ liệu trong trình duyệt này. Hãy sao lưu dữ liệu để tránh mất nội dung.')}};
function find(id,n=root,p=null){if(n.id===id)return{n,p};for(const c of (n.children||[])){const r=find(id,c,n);if(r)return r}return null}
function openUrl(value){let u=(value||'').trim();if(!u)return;if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;try{const parsed=new URL(u);if(!['http:','https:','mailto:'].includes(parsed.protocol)){alert('Chỉ hỗ trợ liên kết http, https hoặc mailto.');return}window.open(u,'_blank','noopener,noreferrer')}catch(e){alert('Đường dẫn không hợp lệ.')}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function makeNode(n){const el=document.createElement('div');el.className='node'+(n.id===sel?' sel':'');el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',n.title||'Nhánh chưa đặt tên');el.style.width=W+'px';el.style.setProperty('--c',n.color||COLORS[0]);const h=document.createElement('div');h.className='hd';const icon=document.createElement('span');icon.className='ic';icon.textContent=n.icon||'📁';const title=document.createElement('span');title.className='tt';title.textContent=n.title||'(chưa đặt tên)';h.append(icon,title);if(n.url){const a=document.createElement('button');a.className='lk';a.textContent='🔗';a.title=n.url;a.setAttribute('aria-label','Mở liên kết');a.onclick=e=>{e.stopPropagation();openUrl(n.url)};h.append(a)}el.append(h);if(n.img){const image=document.createElement('img');image.src=n.img;image.alt='Ảnh minh họa';el.append(image)}if(n.note){const p=document.createElement('p');p.className='nt';p.textContent=n.note;el.append(p)}(n.items||[]).forEach(item=>{const d=document.createElement('span');d.className='it'+(item.url?' u':'');d.textContent=(item.url?'🔗 ':'')+(item.text||'');if(item.url)d.onclick=e=>{e.stopPropagation();openUrl(item.url)};el.append(d)});if(n.children&&n.children.length){const b=document.createElement('button');b.className='cb';b.textContent=n.collapsed?'+'+n.children.length:'−';b.title=n.collapsed?'Mở rộng nhánh':'Thu gọn nhánh';b.setAttribute('aria-label',b.title);b.onclick=e=>{e.stopPropagation();n.collapsed=!n.collapsed;save();render()};el.append(b)}const select=()=>{if(sel!==n.id){sel=n.id;render();panel()}else if(!edit&&n.url)openUrl(n.url)};el.onclick=select;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select()}};return el}
function render(){nd.innerHTML='';sv.innerHTML='';const visible=[];(function walk(n,depth){n._d=depth;visible.push(n);if(!n.collapsed)(n.children||[]).forEach(c=>walk(c,depth+1))})(root,0);visible.forEach(n=>{n._el=makeNode(n);nd.append(n._el);n._h=n._el.offsetHeight});const kids=n=>n.collapsed?[]:(n.children||[]);function subtreeHeight(n){const children=kids(n);if(!children.length)return n._sh=n._h;return n._sh=Math.max(n._h,children.reduce((sum,c)=>sum+subtreeHeight(c),0)+GAP*(children.length-1))}subtreeHeight(root);function place(n,top){n._x=n._d*(W+HG);const children=kids(n);if(!children.length)n._y=top+(n._sh-n._h)/2;else{const total=children.reduce((sum,c)=>sum+c._sh,0)+GAP*(children.length-1);let cursor=top+(n._sh-total)/2;children.forEach(c=>{place(c,cursor);cursor+=c._sh+GAP});n._y=((children[0]._y+children[0]._h/2)+(children[children.length-1]._y+children[children.length-1]._h/2))/2-n._h/2}n._el.style.left=n._x+'px';n._el.style.top=n._y+'px'}place(root,0);visible.forEach(n=>kids(n).forEach(c=>{const x1=n._x+W,y1=n._y+n._h/2,x2=c._x,y2=c._y+c._h/2,m=(x1+x2)/2,path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M${x1} ${y1} C${m} ${y1} ${m} ${y2} ${x2} ${y2}`);path.setAttribute('fill','none');path.setAttribute('stroke',c.color||COLORS[0]);path.setAttribute('stroke-width','2');path.setAttribute('opacity','.75');sv.append(path)}));apply()}
function apply(){ly.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.k})`}
function fit(){let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;const walk=n=>{x1=Math.min(x1,n._x);y1=Math.min(y1,n._y);x2=Math.max(x2,n._x+W);y2=Math.max(y2,n._y+n._h);if(!n.collapsed)(n.children||[]).forEach(walk)};walk(root);const rect=cv.getBoundingClientRect(),width=Math.max(1,x2-x1),height=Math.max(1,y2-y1),k=Math.min(1.2,Math.max(.25,Math.min((rect.width-60)/width,(rect.height-60)/height)));view={k,x:(rect.width-width*k)/2-x1*k,y:(rect.height-height*k)/2-y1*k};apply()}
function zoom(f,mx,my){const rect=cv.getBoundingClientRect();mx=mx??rect.width/2;my=my??rect.height/2;const k=Math.min(2,Math.max(.2,view.k*f));view.x=mx-(mx-view.x)*k/view.k;view.y=my-(my-view.y)*k/view.k;view.k=k;apply()}
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoom(e.deltaY<0?1.1:.9,e.clientX-r.left,e.clientY-r.top)},{passive:false});let drag=null;cv.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;drag={x:e.clientX-view.x,y:e.clientY-view.y};cv.classList.add('drag');cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!drag)return;view.x=e.clientX-drag.x;view.y=e.clientY-drag.y;apply()});const stopDrag=()=>{drag=null;cv.classList.remove('drag')};cv.addEventListener('pointerup',stopDrag);cv.addEventListener('pointercancel',stopDrag);
function panel(){const found=find(sel);if(!found){pn.innerHTML='<p class="empty">Chọn một nhánh để xem và chỉnh sửa dữ liệu.</p>';return}const n=found.n;pn.innerHTML=`<label style="margin-top:0" for="f_t">Tên nhánh</label><input type="text" id="f_t" value="${esc(n.title)}"><label for="f_i">Biểu tượng (chọn hoặc gõ emoji)</label><input type="text" id="f_i" value="${esc(n.icon)}" style="width:75px"><div class="ics" style="margin-top:5px">${ICONS.map(i=>`<span role="button" tabindex="0" title="${i}">${i}</span>`).join('')}</div><label>Màu nhánh</label><div class="sw">${COLORS.map(c=>`<i role="button" tabindex="0" aria-label="Màu ${c}" data-c="${c}" style="background:${c}" class="${c===n.color?'on':''}"></i>`).join('')}</div><label for="f_u">Đường dẫn của nhánh</label><input type="text" id="f_u" value="${esc(n.url)}" placeholder="https://..."><label for="f_n">Ghi chú</label><textarea id="f_n">${esc(n.note)}</textarea><label for="f_f">Hình ảnh</label><div class="row"><input type="file" id="f_f" accept="image/*" style="flex:1;min-width:0">${n.img?'<button class="b" id="f_r">Xóa ảnh</button>':''}</div><label>Thông tin chi tiết</label><div id="its">${(n.items||[]).map((item,i)=>`<div class="row"><input type="text" data-i="${i}" data-k="text" value="${esc(item.text)}" placeholder="Nội dung"><input type="text" data-i="${i}" data-k="url" value="${esc(item.url)}" placeholder="Liên kết (không bắt buộc)"><button class="b d" type="button" data-x="${i}" aria-label="Xóa thông tin">×</button></div>`).join('')}</div><button class="b" id="f_a" type="button">＋ Thêm thông tin</button><p class="hint">Có thể dùng liên kết Google Drive, OneDrive hoặc SharePoint. Dữ liệu được lưu tự động trên trình duyệt này.</p>`;const update=()=>{save();render()};$('f_t').oninput=e=>{n.title=e.target.value;update()};$('f_i').oninput=e=>{n.icon=e.target.value;update()};$('f_u').oninput=e=>{n.url=e.target.value;update()};$('f_n').oninput=e=>{n.note=e.target.value;update()};pn.querySelectorAll('.ics span').forEach(s=>s.onclick=()=>{$('f_i').value=s.textContent;n.icon=s.textContent;update()});pn.querySelectorAll('.sw i').forEach(s=>s.onclick=()=>{n.color=s.dataset.c;update();panel()});pn.querySelectorAll('#its input').forEach(input=>input.oninput=e=>{n.items[Number(e.target.dataset.i)][e.target.dataset.k]=e.target.value;update()});pn.querySelectorAll('[data-x]').forEach(button=>button.onclick=()=>{n.items.splice(Number(button.dataset.x),1);save();panel();render()});$('f_a').onclick=()=>{n.items.push({text:'',url:''});save();panel();render()};if($('f_r'))$('f_r').onclick=()=>{n.img='';save();panel();render()};$('f_f').onchange=e=>{const file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Chỉ có thể tải lên tệp hình ảnh.');return}const reader=new FileReader();reader.onload=()=>{const image=new Image();image.onload=()=>{const scale=Math.min(1,900/image.width,700/image.height),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);n.img=canvas.toDataURL('image/jpeg',.82);save();panel();render()};image.onerror=()=>alert('Không đọc được hình ảnh.');image.src=reader.result};reader.readAsDataURL(file)}}
function add(parent){if(!parent)return;const node=mkN('Nhánh mới',{color:parent.color||COLORS[0],icon:'📄'});parent.children=parent.children||[];parent.children.push(node);parent.collapsed=false;sel=node.id;save();render();panel();const input=$('f_t');input.focus();input.select()}
$('addc').onclick=()=>add(find(sel)?.n);$('adds').onclick=()=>{const f=find(sel);add(f?.p||root)};$('del').onclick=()=>{const f=find(sel);if(!f?.p){alert('Không thể xóa nhánh gốc.');return}if(!confirm(`Xóa nhánh “${f.n.title}” và toàn bộ nhánh con?`))return;f.p.children=f.p.children.filter(c=>c!==f.n);sel=f.p.id;save();render();panel()};function setAll(collapsed){(function walk(n){if(n.children?.length)n.collapsed=collapsed;n.children?.forEach(walk)})(root);if(!collapsed)root.collapsed=false;save();render();fit()}$('exa').onclick=()=>setAll(false);$('coa').onclick=()=>setAll(true);$('zi').onclick=()=>zoom(1.2);$('zo').onclick=()=>zoom(1/1.2);$('fit').onclick=fit;
$('mode').onclick=e=>{edit=!edit;e.currentTarget.textContent='Chế độ: '+(edit?'Chỉnh sửa':'Xem (bấm nhánh để mở liên kết)');pn.style.display=edit?'':'none'};
$('theme').onclick=e=>{themeMode=themeMode==='auto'?'dark':themeMode==='dark'?'light':'auto';if(themeMode==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=themeMode;e.currentTarget.textContent='Giao diện: '+({auto:'Tự động',dark:'Tối',light:'Sáng'}[themeMode])};
const dg=$('dg'),jt=$('jt');$('io').onclick=()=>{jt.value=JSON.stringify(root,(key,value)=>key.startsWith('_')?undefined:value,2);dg.showModal()};$('jx').onclick=()=>dg.close();$('jc').onclick=async()=>{jt.select();try{await navigator.clipboard.writeText(jt.value)}catch(e){document.execCommand('copy')}const b=$('jc');b.textContent='Đã sao chép';setTimeout(()=>b.textContent='Sao chép',1200)};$('ji').onclick=()=>{try{const imported=JSON.parse(jt.value);if(!imported||typeof imported!=='object'||!imported.id||!Array.isArray(imported.children))throw new Error('Dữ liệu không đúng định dạng sơ đồ cây.');if(!confirm('Thay toàn bộ dữ liệu hiện tại bằng dữ liệu vừa dán?'))return;root=imported;sel=root.id;save();render();panel();fit();dg.close()}catch(e){alert(e.message||'Không thể đọc dữ liệu JSON.')}};
render();panel();requestAnimationFrame(fit);window.addEventListener('resize',()=>fit());
</script>
</body>
</html>
